[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blueprint-designer"
version = "0.1.0"
description = "RNA Blueprint Designer"
requires-python = ">=3.10"

dependencies = [
    "PySide6>=6.6",
    "pyfurnace",
]

[project.scripts]
blueprint-designer = "src.main:main"

[tool.setuptools]
packages = ["src"]

