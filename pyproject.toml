
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blueprint-designer-henrik-m01"
version = "1.0.1"
authors = [
    { name = "Henrik Mengkrogen", email = "henrik.mengkrogen@gmail.com" }
]
description = "RNA Blueprint Designer"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

dependencies = [
    "PySide6>=6.6",
    "pyfurnace",
]

[project.scripts]
blueprint-designer = "blueprint_designer.main:main"

[tool.setuptools.packages.find]
where = ["src"]
